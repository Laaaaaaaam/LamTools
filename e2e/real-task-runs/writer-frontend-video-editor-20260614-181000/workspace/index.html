<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoForge - 视频剪辑</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 顶部工具栏 -->
  <header id="toolbar">
    <div class="toolbar-left">
      <span class="app-title">🎬 VideoForge</span>
      <button id="btn-import" title="导入媒体">📁 导入</button>
      <input type="file" id="file-input" multiple accept="video/*,audio/*,image/*" hidden>
    </div>
    <div class="toolbar-center">
      <button id="btn-undo" title="撤销">↩</button>
      <button id="btn-redo" title="重做">↪</button>
      <span class="separator">|</span>
      <button id="btn-split" title="分割片段 (S)">✂ 分割</button>
      <button id="btn-delete" title="删除片段 (Del)">🗑 删除</button>
    </div>
    <div class="toolbar-right">
      <button id="btn-export" title="导出视频">📤 导出</button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main id="workspace">
    <!-- 左侧：媒体池 -->
    <aside id="media-pool">
      <h3>媒体库</h3>
      <div id="drop-zone" class="drop-zone">
        <p>拖放媒体文件到此处</p>
        <p class="hint">或点击「导入」按钮</p>
      </div>
      <div id="asset-list" class="asset-list"></div>
    </aside>

    <!-- 中间：预览 + 时间线 -->
    <section id="editor-area">
      <!-- 预览区 -->
      <div id="preview-section">
        <div id="preview-container">
          <canvas id="preview-canvas" width="640" height="360"></canvas>
          <div id="text-overlay-preview"></div>
        </div>
        <div id="playback-controls">
          <button id="btn-skip-start" title="跳到开头">⏮</button>
          <button id="btn-play" title="播放/暂停 (Space)">▶</button>
          <button id="btn-skip-end" title="跳到末尾">⏭</button>
          <span id="time-display">00:00.00 / 00:00.00</span>
        </div>
      </div>

      <!-- 时间线区 -->
      <div id="timeline-section">
        <div id="timeline-header">
          <div id="track-labels">
            <div class="track-label video-label">🎬 视频</div>
            <div class="track-label video-label">🎬 视频 2</div>
            <div class="track-label audio-label">🔊 音频</div>
            <div class="track-label audio-label">🔊 音频 2</div>
            <div class="track-label text-label">📝 文字</div>
          </div>
          <div id="timeline-scroll">
            <div id="time-ruler"></div>
            <div id="tracks-container">
              <div class="track video-track" data-track-index="0"></div>
              <div class="track video-track" data-track-index="1"></div>
              <div class="track audio-track" data-track-index="2"></div>
              <div class="track audio-track" data-track-index="3"></div>
              <div class="track text-track" data-track-index="4"></div>
            </div>
            <div id="playhead" class="playhead"></div>
          </div>
        </div>
        <div id="timeline-zoom">
          <label>缩放:</label>
          <input type="range" id="zoom-slider" min="20" max="200" value="60">
        </div>
      </div>
    </section>

    <!-- 右侧：属性面板 -->
    <aside id="property-panel">
      <h3>属性</h3>
      <div id="no-selection" class="no-selection">
        <p>选择片段以编辑属性</p>
      </div>
      <div id="clip-properties" class="clip-properties hidden">
        <div class="prop-group">
          <label>片段名称</label>
          <input type="text" id="prop-clip-name" readonly>
        </div>
        <div class="prop-group">
          <label>起始时间</label>
          <input type="number" id="prop-start" step="0.01" min="0">
        </div>
        <div class="prop-group">
          <label>持续时间</label>
          <input type="number" id="prop-duration" step="0.01" min="0.1">
        </div>
        <div class="prop-group">
          <label>裁剪起点</label>
          <input type="number" id="prop-trim-start" step="0.01" min="0">
        </div>
        <div class="prop-group">
          <label>音量</label>
          <input type="range" id="prop-volume" min="0" max="1" step="0.01" value="1">
          <span id="volume-value">100%</span>
        </div>
        <!-- 转场 -->
        <div class="prop-group">
          <label>入场转场</label>
          <select id="prop-transition-in">
            <option value="none">无</option>
            <option value="fade">淡入</option>
            <option value="dissolve">溶解</option>
          </select>
        </div>
        <div class="prop-group">
          <label>转场时长(秒)</label>
          <input type="number" id="prop-transition-duration" step="0.1" min="0.1" max="2" value="0.5">
        </div>
        <!-- 文字叠加 -->
        <div id="text-props" class="prop-group hidden">
          <h4>文字叠加</h4>
          <label>内容</label>
          <textarea id="prop-text-content" rows="2"></textarea>
          <label>字体</label>
          <select id="prop-text-font">
            <option value="Arial">Arial</option>
            <option value="sans-serif">Sans-serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
            <option value="SimHei">黑体</option>
            <option value="SimSun">宋体</option>
            <option value="KaiTi">楷体</option>
          </select>
          <label>大小</label>
          <input type="number" id="prop-text-size" min="12" max="200" value="48">
          <label>颜色</label>
          <input type="color" id="prop-text-color" value="#ffffff">
          <label>X 位置</label>
          <input type="number" id="prop-text-x" min="0" max="100" value="50">
          <label>Y 位置</label>
          <input type="number" id="prop-text-y" min="0" max="100" value="50">
        </div>
      </div>
    </aside>
  </main>

  <!-- 导出对话框 -->
  <div id="export-dialog" class="dialog hidden">
    <div class="dialog-content">
      <h3>导出视频</h3>
      <div class="prop-group">
        <label>格式</label>
        <select id="export-format">
          <option value="mp4">MP4 (H.264)</option>
          <option value="webm">WebM (VP9)</option>
        </select>
      </div>
      <div class="prop-group">
        <label>分辨率</label>
        <select id="export-resolution">
          <option value="1920x1080">1080p (1920×1080)</option>
          <option value="1280x720">720p (1280×720)</option>
          <option value="854x480">480p (854×480)</option>
        </select>
      </div>
      <div class="prop-group">
        <label>帧率</label>
        <select id="export-fps">
          <option value="30">30 fps</option>
          <option value="24">24 fps</option>
          <option value="60">60 fps</option>
        </select>
      </div>
      <div id="export-progress-container" class="hidden">
        <label>导出进度</label>
        <progress id="export-progress" max="100" value="0"></progress>
        <span id="export-progress-text">0%</span>
      </div>
      <div class="dialog-buttons">
        <button id="btn-export-cancel">取消</button>
        <button id="btn-export-start">开始导出</button>
      </div>
    </div>
  </div>

  <!-- 隐藏的媒体元素 -->
  <div id="hidden-media" style="display:none;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
