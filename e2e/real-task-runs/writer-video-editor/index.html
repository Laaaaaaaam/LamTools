<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoForge - 本地视频剪辑</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/modal.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <div class="toolbar-left">
            <div class="app-logo">
                <i class="fas fa-film"></i>
                <span>VideoForge</span>
            </div>
            <div class="toolbar-divider"></div>
            <button class="toolbar-btn" id="btn-import" title="导入媒体">
                <i class="fas fa-file-import"></i>
                <span>导入</span>
            </button>
            <button class="toolbar-btn" id="btn-undo" title="撤销">
                <i class="fas fa-undo"></i>
            </button>
            <button class="toolbar-btn" id="btn-redo" title="重做">
                <i class="fas fa-redo"></i>
            </button>
            <div class="toolbar-divider"></div>
            <button class="toolbar-btn" id="btn-split" title="分割片段 (S)">
                <i class="fas fa-cut"></i>
                <span>分割</span>
            </button>
            <button class="toolbar-btn" id="btn-delete" title="删除片段 (Delete)">
                <i class="fas fa-trash"></i>
                <span>删除</span>
            </button>
            <button class="toolbar-btn" id="btn-copy" title="复制片段 (Ctrl+C)">
                <i class="fas fa-copy"></i>
            </button>
            <button class="toolbar-btn" id="btn-paste" title="粘贴片段 (Ctrl+V)">
                <i class="fas fa-paste"></i>
            </button>
        </div>
        <div class="toolbar-center">
            <span class="project-name" id="project-name">未命名项目</span>
        </div>
        <div class="toolbar-right">
            <button class="toolbar-btn primary" id="btn-export" title="导出视频">
                <i class="fas fa-download"></i>
                <span>导出</span>
            </button>
        </div>
    </header>

    <!-- 主工作区 -->
    <main class="workspace">
        <!-- 左侧面板 - 媒体库 -->
        <aside class="panel panel-left" id="panel-media">
            <div class="panel-header">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-tab="media">
                        <i class="fas fa-photo-video"></i> 媒体库
                    </button>
                    <button class="panel-tab" data-tab="effects">
                        <i class="fas fa-magic"></i> 特效
                    </button>
                    <button class="panel-tab" data-tab="transitions">
                        <i class="fas fa-exchange-alt"></i> 转场
                    </button>
                </div>
            </div>
            <div class="panel-content">
                <!-- 媒体库 -->
                <div class="tab-content active" id="tab-media">
                    <div class="media-import-zone" id="media-import-zone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>拖拽文件到此处或点击导入</p>
                        <span>支持 MP4, WebM, MOV, MP3, WAV, PNG, JPG</span>
                    </div>
                    <div class="media-list" id="media-list"></div>
                </div>
                <!-- 特效 -->
                <div class="tab-content" id="tab-effects">
                    <div class="effects-grid">
                        <div class="effect-item" data-effect="brightness">
                            <div class="effect-preview"><i class="fas fa-sun"></i></div>
                            <span>亮度</span>
                        </div>
                        <div class="effect-item" data-effect="contrast">
                            <div class="effect-preview"><i class="fas fa-adjust"></i></div>
                            <span>对比度</span>
                        </div>
                        <div class="effect-item" data-effect="saturation">
                            <div class="effect-preview"><i class="fas fa-palette"></i></div>
                            <span>饱和度</span>
                        </div>
                        <div class="effect-item" data-effect="blur">
                            <div class="effect-preview"><i class="fas fa-water"></i></div>
                            <span>模糊</span>
                        </div>
                        <div class="effect-item" data-effect="grayscale">
                            <div class="effect-preview"><i class="fas fa-circle-notch"></i></div>
                            <span>灰度</span>
                        </div>
                        <div class="effect-item" data-effect="sepia">
                            <div class="effect-preview"><i class="fas fa-image"></i></div>
                            <span>复古</span>
                        </div>
                        <div class="effect-item" data-effect="invert">
                            <div class="effect-preview"><i class="fas fa-exchange-alt"></i></div>
                            <span>反色</span>
                        </div>
                        <div class="effect-item" data-effect="hue-rotate">
                            <div class="effect-preview"><i class="fas fa-sync"></i></div>
                            <span>色相旋转</span>
                        </div>
                    </div>
                </div>
                <!-- 转场 -->
                <div class="tab-content" id="tab-transitions">
                    <div class="transitions-grid">
                        <div class="transition-item" data-transition="fade">
                            <div class="transition-preview">淡入淡出</div>
                            <span>淡入淡出</span>
                        </div>
                        <div class="transition-item" data-transition="dissolve">
                            <div class="transition-preview">溶解</div>
                            <span>溶解</span>
                        </div>
                        <div class="transition-item" data-transition="wipe-left">
                            <div class="transition-preview">左擦除</div>
                            <span>左擦除</span>
                        </div>
                        <div class="transition-item" data-transition="wipe-right">
                            <div class="transition-preview">右擦除</div>
                            <span>右擦除</span>
                        </div>
                        <div class="transition-item" data-transition="wipe-up">
                            <div class="transition-preview">上擦除</div>
                            <span>上擦除</span>
                        </div>
                        <div class="transition-item" data-transition="wipe-down">
                            <div class="transition-preview">下擦除</div>
                            <span>下擦除</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 中间预览区 -->
        <section class="preview-area">
            <div class="preview-container" id="preview-container">
                <div class="preview-canvas-wrapper">
                    <canvas id="preview-canvas"></canvas>
                    <div class="preview-overlay" id="preview-overlay">
                        <i class="fas fa-play-circle"></i>
                    </div>
                    <!-- 文字叠加层 -->
                    <div class="text-overlay-container" id="text-overlay-container"></div>
                </div>
                <div class="preview-controls">
                    <div class="time-display">
                        <span id="current-time">00:00:00.00</span>
                        <span class="time-separator">/</span>
                        <span id="total-time">00:00:00.00</span>
                    </div>
                    <div class="playback-controls">
                        <button class="control-btn" id="btn-skip-back" title="后退5秒">
                            <i class="fas fa-backward"></i>
                        </button>
                        <button class="control-btn" id="btn-frame-back" title="上一帧">
                            <i class="fas fa-step-backward"></i>
                        </button>
                        <button class="control-btn play-btn" id="btn-play" title="播放/暂停 (Space)">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="control-btn" id="btn-frame-forward" title="下一帧">
                            <i class="fas fa-step-forward"></i>
                        </button>
                        <button class="control-btn" id="btn-skip-forward" title="前进5秒">
                            <i class="fas fa-forward"></i>
                        </button>
                    </div>
                    <div class="volume-control">
                        <button class="control-btn" id="btn-volume">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="100" value="100" class="volume-slider">
                    </div>
                    <div class="zoom-control">
                        <button class="control-btn" id="btn-zoom-fit" title="适应窗口">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右侧属性面板 -->
        <aside class="panel panel-right" id="panel-properties">
            <div class="panel-header">
                <h3><i class="fas fa-sliders-h"></i> 属性</h3>
            </div>
            <div class="panel-content">
                <div class="property-section" id="prop-transform">
                    <h4 class="property-title">
                        <i class="fas fa-arrows-alt"></i> 变换
                    </h4>
                    <div class="property-grid">
                        <div class="property-item">
                            <label>X 位置</label>
                            <input type="number" id="prop-x" value="0" step="1">
                        </div>
                        <div class="property-item">
                            <label>Y 位置</label>
                            <input type="number" id="prop-y" value="0" step="1">
                        </div>
                        <div class="property-item">
                            <label>宽度</label>
                            <input type="number" id="prop-width" value="0" step="1">
                        </div>
                        <div class="property-item">
                            <label>高度</label>
                            <input type="number" id="prop-height" value="0" step="1">
                        </div>
                        <div class="property-item">
                            <label>旋转</label>
                            <input type="range" id="prop-rotation" min="-180" max="180" value="0">
                            <span class="range-value" id="rotation-value">0°</span>
                        </div>
                        <div class="property-item">
                            <label>缩放</label>
                            <input type="range" id="prop-scale" min="10" max="300" value="100">
                            <span class="range-value" id="scale-value">100%</span>
                        </div>
                        <div class="property-item">
                            <label>透明度</label>
                            <input type="range" id="prop-opacity" min="0" max="100" value="100">
                            <span class="range-value" id="opacity-value">100%</span>
                        </div>
                    </div>
                </div>
                <div class="property-section" id="prop-filters">
                    <h4 class="property-title">
                        <i class="fas fa-magic"></i> 滤镜
                    </h4>
                    <div class="property-grid">
                        <div class="property-item">
                            <label>亮度</label>
                            <input type="range" id="filter-brightness" min="0" max="200" value="100">
                            <span class="range-value" id="brightness-value">100%</span>
                        </div>
                        <div class="property-item">
                            <label>对比度</label>
                            <input type="range" id="filter-contrast" min="0" max="200" value="100">
                            <span class="range-value" id="contrast-value">100%</span>
                        </div>
                        <div class="property-item">
                            <label>饱和度</label>
                            <input type="range" id="filter-saturation" min="0" max="200" value="100">
                            <span class="range-value" id="saturation-value">100%</span>
                        </div>
                        <div class="property-item">
                            <label>模糊</label>
                            <input type="range" id="filter-blur" min="0" max="20" value="0">
                            <span class="range-value" id="blur-value">0px</span>
                        </div>
                        <div class="property-item">
                            <label>色相</label>
                            <input type="range" id="filter-hue" min="0" max="360" value="0">
                            <span class="range-value" id="hue-value">0°</span>
                        </div>
                    </div>
                </div>
                <div class="property-section" id="prop-text">
                    <h4 class="property-title">
                        <i class="fas fa-font"></i> 文字
                    </h4>
                    <div class="property-grid">
                        <div class="property-item full-width">
                            <label>文字内容</label>
                            <textarea id="text-content" rows="3" placeholder="输入文字内容..."></textarea>
                        </div>
                        <div class="property-item">
                            <label>字体大小</label>
                            <input type="number" id="text-size" value="32" min="8" max="200">
                        </div>
                        <div class="property-item">
                            <label>字体颜色</label>
                            <input type="color" id="text-color" value="#ffffff">
                        </div>
                        <div class="property-item">
                            <label>字体</label>
                            <select id="text-font">
                                <option value="Inter">Inter</option>
                                <option value="Arial">Arial</option>
                                <option value="serif">Serif</option>
                                <option value="monospace">Monospace</option>
                                <option value="cursive">Cursive</option>
                            </select>
                        </div>
                        <div class="property-item">
                            <label>粗细</label>
                            <select id="text-weight">
                                <option value="300">细体</option>
                                <option value="400">常规</option>
                                <option value="600">半粗</option>
                                <option value="700" selected>粗体</option>
                            </select>
                        </div>
                        <div class="property-item">
                            <label>描边颜色</label>
                            <input type="color" id="text-stroke-color" value="#000000">
                        </div>
                        <div class="property-item">
                            <label>描边宽度</label>
                            <input type="number" id="text-stroke-width" value="2" min="0" max="10">
                        </div>
                        <div class="property-item">
                            <label>背景色</label>
                            <input type="color" id="text-bg-color" value="#000000">
                        </div>
                        <div class="property-item">
                            <label>背景透明度</label>
                            <input type="range" id="text-bg-opacity" min="0" max="100" value="0">
                        </div>
                        <div class="property-item full-width">
                            <button class="action-btn" id="btn-add-text">
                                <i class="fas fa-plus"></i> 添加文字层
                            </button>
                        </div>
                    </div>
                </div>
                <div class="property-section" id="prop-speed">
                    <h4 class="property-title">
                        <i class="fas fa-tachometer-alt"></i> 速度
                    </h4>
                    <div class="property-grid">
                        <div class="property-item full-width">
                            <label>播放速度</label>
                            <div class="speed-presets">
                                <button class="speed-btn" data-speed="0.25">0.25x</button>
                                <button class="speed-btn" data-speed="0.5">0.5x</button>
                                <button class="speed-btn" data-speed="0.75">0.75x</button>
                                <button class="speed-btn active" data-speed="1">1x</button>
                                <button class="speed-btn" data-speed="1.5">1.5x</button>
                                <button class="speed-btn" data-speed="2">2x</button>
                            </div>
                            <input type="range" id="prop-speed" min="10" max="400" value="100">
                            <span class="range-value" id="speed-value">1.0x</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- 时间线区域 -->
    <section class="timeline-area" id="timeline-area">
        <div class="timeline-toolbar">
            <div class="timeline-tools">
                <button class="tl-tool-btn active" id="btn-magnet" title="磁吸">
                    <i class="fas fa-magnet"></i>
                </button>
                <button class="tl-tool-btn" id="btn-razor" title="剃刀工具 (S)">
                    <i class="fas fa-cut"></i>
                </button>
                <button class="tl-tool-btn active" id="btn-select" title="选择工具 (V)">
                    <i class="fas fa-mouse-pointer"></i>
                </button>
            </div>
            <div class="timeline-zoom">
                <button class="tl-zoom-btn" id="btn-zoom-out">
                    <i class="fas fa-search-minus"></i>
                </button>
                <input type="range" id="timeline-zoom" min="1" max="100" value="30">
                <button class="tl-zoom-btn" id="btn-zoom-in">
                    <i class="fas fa-search-plus"></i>
                </button>
            </div>
        </div>
        <div class="timeline-scroll-container" id="timeline-scroll">
            <!-- 时间刻度尺 -->
            <div class="timeline-ruler" id="timeline-ruler">
                <div class="playhead" id="playhead">
                    <div class="playhead-head"></div>
                    <div class="playhead-line"></div>
                </div>
            </div>
            <!-- 轨道区域 -->
            <div class="timeline-tracks" id="timeline-tracks">
                <!-- 视频轨道 -->
                <div class="track-group" id="video-tracks">
                    <div class="track-labels">
                        <div class="track-label video-label">
                            <i class="fas fa-video"></i>
                            <span>V1</span>
                            <div class="track-controls">
                                <button class="track-ctrl-btn" data-action="mute" title="静音"><i class="fas fa-eye"></i></button>
                                <button class="track-ctrl-btn" data-action="lock" title="锁定"><i class="fas fa-lock-open"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="tracks-content" id="video-tracks-content">
                        <div class="track video-track" data-track="V1" id="track-V1"></div>
                    </div>
                </div>
                <!-- 音频轨道 -->
                <div class="track-group" id="audio-tracks">
                    <div class="track-labels">
                        <div class="track-label audio-label">
                            <i class="fas fa-music"></i>
                            <span>A1</span>
                            <div class="track-controls">
                                <button class="track-ctrl-btn" data-action="mute" title="静音"><i class="fas fa-volume-up"></i></button>
                                <button class="track-ctrl-btn" data-action="lock" title="锁定"><i class="fas fa-lock-open"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="tracks-content" id="audio-tracks-content">
                        <div class="track audio-track" data-track="A1" id="track-A1"></div>
                    </div>
                </div>
                <!-- 文字轨道 -->
                <div class="track-group" id="text-tracks">
                    <div class="track-labels">
                        <div class="track-label text-label">
                            <i class="fas fa-font"></i>
                            <span>T1</span>
                            <div class="track-controls">
                                <button class="track-ctrl-btn" data-action="mute" title="隐藏"><i class="fas fa-eye"></i></button>
                                <button class="track-ctrl-btn" data-action="lock" title="锁定"><i class="fas fa-lock-open"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="tracks-content" id="text-tracks-content">
                        <div class="track text-track" data-track="T1" id="track-T1"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 导出模态框 -->
    <div class="modal" id="export-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-download"></i> 导出视频</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="export-settings">
                    <div class="export-group">
                        <label>格式</label>
                        <select id="export-format">
                            <option value="webm">WebM (VP9)</option>
                            <option value="mp4">MP4 (H.264)*</option>
                        </select>
                    </div>
                    <div class="export-group">
                        <label>分辨率</label>
                        <select id="export-resolution">
                            <option value="1920x1080">1080p (1920×1080)</option>
                            <option value="1280x720" selected>720p (1280×720)</option>
                            <option value="854x480">480p (854×480)</option>
                            <option value="640x360">360p (640×360)</option>
                        </select>
                    </div>
                    <div class="export-group">
                        <label>帧率</label>
                        <select id="export-fps">
                            <option value="60">60 fps</option>
                            <option value="30" selected>30 fps</option>
                            <option value="24">24 fps</option>
                        </select>
                    </div>
                    <div class="export-group">
                        <label>视频质量</label>
                        <input type="range" id="export-quality" min="1" max="100" value="80">
                        <span id="quality-value">80%</span>
                    </div>
                </div>
                <div class="export-progress" id="export-progress" style="display:none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progress-text">正在导出...</span>
                        <span id="progress-percent">0%</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-export-cancel">取消</button>
                <button class="btn btn-primary" id="btn-export-start">
                    <i class="fas fa-download"></i> 开始导出
                </button>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="file-input" multiple accept="video/*,audio/*,image/*" style="display:none">

    <!-- 隐藏的视频/音频元素 -->
    <video id="hidden-video" style="display:none" preload="auto"></video>
    <audio id="hidden-audio" style="display:none" preload="auto"></audio>

    <script src="js/utils.js"></script>
    <script src="js/media.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/export.js"></script>
    <script src="js/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
