<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话</title>
    <style>
        /* ===== 全局重置 & 布局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 480px;
            height: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 头部 ===== */
        .chat-header {
            background: #1a73e8;
            color: white;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        /* ===== 消息列表 ===== */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #1a73e8;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: #f0f2f5;
            color: #1a1a1a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* 打字光标动画 */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #1a73e8;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ===== 输入区域 ===== */
        .input-area {
            border-top: 1px solid #e8e8e8;
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            background: white;
        }

        .input-area textarea {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 15px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.4;
            min-height: 42px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: #1a73e8;
        }

        .input-area button {
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .input-area button:hover {
            background: #1557b0;
        }

        .input-area button:active {
            transform: scale(0.96);
        }

        .input-area button:disabled {
            background: #a0c4f1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 头部 -->
        <div class="chat-header">💬 AI 对话</div>

        <!-- 消息列表 -->
        <div class="message-list" id="messageList"></div>

        <!-- 输入区域 -->
        <div class="input-area">
            <textarea id="inputBox" rows="1" placeholder="输入消息..." 
                      onkeydown="handleKeyDown(event)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // ===== DOM 引用 =====
        const messageList = document.getElementById('messageList');
        const inputBox = document.getElementById('inputBox');
        const sendBtn = document.getElementById('sendBtn');

        // 当前正在接收 AI 回复的 DOM 元素
        let currentAiMessageEl = null;
        // 是否正在流式接收中
        let isReceiving = false;

        // ===== 辅助函数 =====
        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            messageList.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            messageList.scrollTop = messageList.scrollHeight;
        }

        // ===== 输入框自适应高度 =====
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        inputBox.addEventListener('input', () => autoResize(inputBox));

        // ===== 回车发送 (Shift+Enter 换行) =====
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // ===== 核心：发送消息 & SSE 流式接收 =====
        async function sendMessage() {
            const text = inputBox.value.trim();
            if (!text || isReceiving) return;

            // 清空输入框并重置高度
            inputBox.value = '';
            inputBox.style.height = 'auto';

            // 显示用户消息
            addMessage(text, 'user');

            // 创建 AI 消息占位（带光标）
            const aiEl = document.createElement('div');
            aiEl.className = 'message ai';
            aiEl.innerHTML = '<span class="ai-text"></span><span class="cursor-blink"></span>';
            messageList.appendChild(aiEl);
            scrollToBottom();

            const aiTextSpan = aiEl.querySelector('.ai-text');
            currentAiMessageEl = aiEl;
            isReceiving = true;
            sendBtn.disabled = true;

            try {
                // 发起 SSE 请求
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 解析 SSE 数据 (格式: data: {...}\n\n)
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || ''; // 保留不完整的行

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6);
                            try {
                                const data = JSON.parse(jsonStr);
                                if (data.done) {
                                    // 流结束，移除光标
                                    const cursor = aiEl.querySelector('.cursor-blink');
                                    if (cursor) cursor.remove();
                                } else if (data.token) {
                                    // 追加 token
                                    aiTextSpan.textContent += data.token;
                                    scrollToBottom();
                                }
                            } catch (e) {
                                // JSON 解析失败，忽略
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('SSE 错误:', error);
                aiTextSpan.textContent = '[连接错误] ' + error.message;
                const cursor = aiEl.querySelector('.cursor-blink');
                if (cursor) cursor.remove();
            } finally {
                isReceiving = false;
                sendBtn.disabled = false;
                currentAiMessageEl = null;
            }
        }
    </script>
</body>
</html>
