<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight/lib/index.umd.js"></script>
</head>
<body>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
                    <path d="M16 14h.01"/><path d="M8 14h.01"/>
                    <path d="M12 18v4"/><path d="M8 22h8"/>
                    <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
                </svg>
                <span>AI 对话助手</span>
            </div>
            <button id="newChatBtn" class="new-chat-btn" title="新建对话">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>
        <div class="sidebar-search">
            <input type="text" id="searchInput" placeholder="搜索对话..." />
        </div>
        <div id="chatList" class="chat-list"></div>
        <div class="sidebar-footer">
            <button id="clearAllBtn" class="clear-all-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                清除所有对话
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button id="toggleSidebar" class="icon-btn" title="切换侧边栏">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="model-selector">
                <select id="modelSelect">
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                    <option value="claude-3-haiku">Claude 3 Haiku</option>
                    <option value="deepseek-chat">DeepSeek Chat</option>
                    <option value="glm-4">GLM-4</option>
                </select>
            </div>
            <button id="settingsBtn" class="icon-btn" title="设置">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </header>

        <div id="chatArea" class="chat-area">
            <div id="welcomeScreen" class="welcome-screen">
                <div class="welcome-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
                        <path d="M16 14h.01"/><path d="M8 14h.01"/>
                        <path d="M12 18v4"/><path d="M8 22h8"/>
                        <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
                    </svg>
                </div>
                <h1>你好，我是 AI 对话助手</h1>
                <p>我可以帮你回答问题、编写代码、创作文案、分析数据等。开始对话吧！</p>
                <div class="quick-prompts">
                    <button class="quick-prompt" data-prompt="帮我写一个Python快速排序算法">
                        <span class="prompt-icon">💻</span><span>编写快速排序算法</span>
                    </button>
                    <button class="quick-prompt" data-prompt="用简单的语言解释量子计算">
                        <span class="prompt-icon">🔬</span><span>解释量子计算</span>
                    </button>
                    <button class="quick-prompt" data-prompt="帮我写一封商务邮件，主题是项目进度汇报">
                        <span class="prompt-icon">✉️</span><span>撰写商务邮件</span>
                    </button>
                    <button class="quick-prompt" data-prompt="推荐5本关于人工智能的书籍">
                        <span class="prompt-icon">📚</span><span>推荐AI书籍</span>
                    </button>
                </div>
            </div>
            <div id="messagesContainer" class="messages-container" style="display:none;"></div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="输入你的消息... (Shift+Enter换行)" rows="1"></textarea>
                <button id="sendBtn" class="send-btn" title="发送" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
                <button id="stopBtn" class="stop-btn" title="停止生成" style="display:none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                    </svg>
                </button>
            </div>
            <div class="input-footer">
                <span class="char-count" id="charCount">0 / 4000</span>
                <span class="disclaimer">AI 可能产生不准确的信息，请注意甄别</span>
            </div>
        </div>
    </main>

    <div id="settingsModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>设置</h2>
                <button id="closeSettings" class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>API 地址</label>
                    <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" />
                </div>
                <div class="setting-group">
                    <label>API Key</label>
                    <div class="password-input">
                        <input type="password" id="apiKey" placeholder="sk-..." />
                        <button id="toggleApiKey" class="icon-btn small" title="显示/隐藏">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>系统提示词</label>
                    <textarea id="systemPrompt" rows="4" placeholder="你是一个有帮助的AI助手...">你是一个有帮助的AI助手，请用中文回答问题。</textarea>
                </div>
                <div class="setting-group">
                    <label>温度 <span id="tempValue">0.7</span></label>
                    <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" />
                </div>
                <div class="setting-group">
                    <label>最大 Tokens</label>
                    <input type="number" id="maxTokens" value="2048" min="1" max="128000" />
                </div>
                <div class="setting-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="streamToggle" checked />
                        <span>流式输出</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="primary-btn">保存设置</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
