<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计数器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            min-width: 380px;
        }

        h1 {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .counter-display {
            position: relative;
            margin: 20px auto;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .counter-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.05);
        }

        .counter-ring-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #6c63ff;
            border-right-color: #6c63ff;
            transition: transform 0.3s ease;
        }

        .counter-value {
            font-size: 72px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(108, 99, 255, 0.5);
            transition: transform 0.15s ease;
            user-select: none;
        }

        .counter-value.bump-up {
            animation: bumpUp 0.2s ease;
        }

        .counter-value.bump-down {
            animation: bumpDown 0.2s ease;
        }

        @keyframes bumpUp {
            0% { transform: scale(1); color: #fff; }
            50% { transform: scale(1.2); color: #6c63ff; }
            100% { transform: scale(1); color: #fff; }
        }

        @keyframes bumpDown {
            0% { transform: scale(1); color: #fff; }
            50% { transform: scale(1.2); color: #ff6b6b; }
            100% { transform: scale(1); color: #fff; }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 36px;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .btn-minus {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border: 2px solid rgba(255, 107, 107, 0.3);
        }

        .btn-minus:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.3);
        }

        .btn-minus:active {
            transform: scale(0.95);
        }

        .btn-plus {
            background: rgba(108, 99, 255, 0.15);
            color: #6c63ff;
            border: 2px solid rgba(108, 99, 255, 0.3);
        }

        .btn-plus:hover {
            background: rgba(108, 99, 255, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(108, 99, 255, 0.3);
        }

        .btn-plus:active {
            transform: scale(0.95);
        }

        .btn-reset {
            width: 50px;
            height: 50px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            align-self: center;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .btn-reset:active {
            transform: scale(0.95);
        }

        .step-control {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .step-control label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .step-input {
            width: 60px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .step-input:focus {
            border-color: rgba(108, 99, 255, 0.5);
        }

        .history {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .history-title {
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .history-items {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 300px;
            margin: 0 auto;
        }

        .history-item {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
        }

        .history-item.positive {
            color: rgba(108, 99, 255, 0.7);
            background: rgba(108, 99, 255, 0.08);
        }

        .history-item.negative {
            color: rgba(255, 107, 107, 0.7);
            background: rgba(255, 107, 107, 0.08);
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.3);
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1>计 数 器</h1>

        <div class="counter-display">
            <div class="counter-ring"></div>
            <div class="counter-ring-progress" id="ringProgress"></div>
            <div class="counter-value" id="counterValue">0</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-minus" id="btnMinus" title="减少">−</button>
            <button class="btn btn-reset" id="btnReset" title="重置">↺</button>
            <button class="btn btn-plus" id="btnPlus" title="增加">+</button>
        </div>

        <div class="step-control">
            <label>步长</label>
            <input type="number" class="step-input" id="stepInput" value="1" min="1" max="1000">
        </div>

        <div class="history">
            <div class="history-title">操作记录</div>
            <div class="history-items" id="historyItems"></div>
        </div>
    </div>

    <script>
        // State
        let count = 0;
        let step = 1;
        const history = [];
        const maxHistory = 12;

        // DOM
        const counterValue = document.getElementById('counterValue');
        const btnMinus = document.getElementById('btnMinus');
        const btnPlus = document.getElementById('btnPlus');
        const btnReset = document.getElementById('btnReset');
        const stepInput = document.getElementById('stepInput');
        const historyItems = document.getElementById('historyItems');
        const ringProgress = document.getElementById('ringProgress');

        // Update display
        function updateDisplay(direction) {
            counterValue.textContent = count;

            // Ring rotation
            ringProgress.style.transform = `rotate(${count * 15}deg)`;

            // Animation
            counterValue.classList.remove('bump-up', 'bump-down');
            void counterValue.offsetWidth; // force reflow
            if (direction === 'up') counterValue.classList.add('bump-up');
            if (direction === 'down') counterValue.classList.add('bump-down');
        }

        // Add history
        function addHistory(value) {
            history.push(value);
            if (history.length > maxHistory) history.shift();
            renderHistory();
        }

        function renderHistory() {
            historyItems.innerHTML = history.map(v => {
                const cls = v > 0 ? 'positive' : v < 0 ? 'negative' : '';
                const sign = v > 0 ? '+' : '';
                return `<span class="history-item ${cls}">${sign}${v}</span>`;
            }).join('');
        }

        // Events
        btnPlus.addEventListener('click', () => {
            step = parseInt(stepInput.value) || 1;
            count += step;
            updateDisplay('up');
            addHistory(step);
        });

        btnMinus.addEventListener('click', () => {
            step = parseInt(stepInput.value) || 1;
            count -= step;
            updateDisplay('down');
            addHistory(-step);
        });

        btnReset.addEventListener('click', () => {
            count = 0;
            history.length = 0;
            updateDisplay();
            renderHistory();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.target === stepInput) return;
            if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') {
                e.preventDefault();
                btnPlus.click();
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                btnMinus.click();
            } else if (e.key === 'r' || e.key === 'R' || e.key === 'Escape') {
                e.preventDefault();
                btnReset.click();
            }
        });

        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (8 + Math.random() * 15) + 's';
            particle.style.animationDelay = (Math.random() * 10) + 's';
            particle.style.width = (2 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            if (Math.random() > 0.5) {
                particle.style.background = 'rgba(108, 99, 255, 0.3)';
            } else {
                particle.style.background = 'rgba(255, 107, 107, 0.2)';
            }
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
