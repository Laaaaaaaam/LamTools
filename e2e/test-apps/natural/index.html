<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒计时器</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #131842;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.3);
      --accent-alt: #ff6b6b;
      --text-primary: #e8eaf6;
      --text-secondary: #7986cb;
      --card-bg: rgba(19, 24, 66, 0.7);
      --border: rgba(0, 212, 255, 0.15);
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 动态背景 */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-layer::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
      top: -200px;
      right: -150px;
      animation: floatBlob1 12s ease-in-out infinite;
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 107, 0.06) 0%, transparent 70%);
      bottom: -200px;
      left: -100px;
      animation: floatBlob2 15s ease-in-out infinite;
    }

    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-80px, 60px) scale(1.1); }
    }

    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, -80px) scale(1.15); }
    }

    /* 星星粒子 */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--max-opacity); }
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 20px;
    }

    /* 标题 */
    .title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), #7c4dff, var(--accent-alt));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* 圆环倒计时 */
    .timer-ring-container {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-ring-container svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .ring-tick {
      fill: none;
      stroke: rgba(0, 212, 255, 0.08);
      stroke-width: 1;
    }

    /* 中间时间显示 */
    .timer-display {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Orbitron', monospace;
    }

    .time-segment {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .time-value {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      font-weight: 900;
      line-height: 1;
      color: var(--text-primary);
      min-width: 2.5ch;
      text-align: center;
      transition: color 0.3s ease;
    }

    .time-value.warning {
      color: #ffd740;
      animation: pulse 1s ease-in-out infinite;
    }

    .time-value.danger {
      color: var(--accent-alt);
      animation: pulse 0.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .time-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .time-colon {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--accent);
      margin: 0 2px;
      animation: colonBlink 1s step-end infinite;
      align-self: flex-start;
      padding-top: 4px;
    }

    .paused .time-colon {
      animation: none;
      opacity: 0.3;
    }

    .idle .time-colon {
      animation: none;
      opacity: 0.5;
    }

    @keyframes colonBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* 输入区域 */
    .input-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .input-section.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      position: absolute;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .time-input {
      width: 80px;
      height: 56px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .time-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(0, 212, 255, 0.05);
    }

    .time-input::placeholder {
      color: rgba(121, 134, 203, 0.4);
    }

    .input-separator {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      padding-top: 18px;
    }

    /* 快捷预设 */
    .presets {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .preset-btn {
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .preset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* 控制按钮 */
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      overflow: hidden;
      letter-spacing: 1px;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-start {
      background: linear-gradient(135deg, #00d4ff, #7c4dff);
      color: #fff;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(0, 212, 255, 0.5);
    }

    .btn-start:active {
      transform: translateY(0);
    }

    .btn-pause {
      background: linear-gradient(135deg, #ffd740, #ff9100);
      color: #1a1a2e;
      box-shadow: 0 4px 20px rgba(255, 215, 64, 0.3);
    }

    .btn-pause:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(255, 215, 64, 0.5);
    }

    .btn-resume {
      background: linear-gradient(135deg, #69f0ae, #00c853);
      color: #1a1a2e;
      box-shadow: 0 4px 20px rgba(105, 240, 174, 0.3);
    }

    .btn-resume:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(105, 240, 174, 0.5);
    }

    .btn-reset {
      background: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .btn-reset:hover {
      border-color: var(--accent-alt);
      color: var(--accent-alt);
      box-shadow: 0 4px 20px rgba(255, 107, 107, 0.2);
      transform: translateY(-2px);
    }

    .btn-icon {
      font-size: 1.1rem;
    }

    /* 完成动画 */
    .completion-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background: rgba(10, 14, 39, 0.95);
      backdrop-filter: blur(20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .completion-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .completion-text {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ffd740, #ff6b6b, #7c4dff, #00d4ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 2s ease-in-out infinite;
    }

    .completion-sub {
      font-size: 1.1rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
    }

    /* 烟花粒子 */
    .firework {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 101;
      animation: fireworkBurst 1s ease-out forwards;
    }

    @keyframes fireworkBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    /* 进度条底部 */
    .progress-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.03);
      z-index: 10;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #7c4dff, var(--accent-alt));
      background-size: 200% 100%;
      animation: gradientShift 3s ease-in-out infinite;
      transition: width 0.5s ease;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .timer-ring-container {
        width: 260px;
        height: 260px;
      }

      .time-input {
        width: 66px;
        height: 48px;
        font-size: 1.2rem;
      }

      .controls {
        flex-wrap: wrap;
        justify-content: center;
      }

      .btn {
        padding: 12px 24px;
        font-size: 0.85rem;
      }
    }

    /* 音频提示 */
    .sound-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .sound-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 旋转的外圈装饰 */
    .outer-ring {
      position: absolute;
      inset: -10px;
      border: 1px dashed rgba(0, 212, 255, 0.1);
      border-radius: 50%;
      animation: spinSlow 60s linear infinite;
    }

    .outer-ring-2 {
      position: absolute;
      inset: -22px;
      border: 1px dotted rgba(124, 77, 255, 0.07);
      border-radius: 50%;
      animation: spinSlow 90s linear infinite reverse;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 微光点 */
    .glow-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: orbitDot var(--orbit-duration, 20s) linear infinite;
    }

    @keyframes orbitDot {
      from {
        transform: rotate(0deg) translateX(var(--orbit-radius, 180px)) rotate(0deg);
      }
      to {
        transform: rotate(360deg) translateX(var(--orbit-radius, 180px)) rotate(-360deg);
      }
    }
  </style>
</head>
<body>
  <!-- 背景层 -->
  <div class="bg-layer"></div>
  <div class="stars" id="stars"></div>

  <!-- 声音开关 -->
  <button class="sound-toggle" id="soundToggle" title="切换声音">🔊</button>

  <!-- 进度条 -->
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
  </div>

  <!-- 主容器 -->
  <div class="container">
    <h1 class="title">Countdown Timer</h1>

    <!-- 倒计时圆环 -->
    <div class="timer-ring-container">
      <div class="outer-ring-2"></div>
      <div class="outer-ring"></div>

      <div class="glow-dot" style="--orbit-duration: 25s; --orbit-radius: 180px;"></div>
      <div class="glow-dot" style="--orbit-duration: 35s; --orbit-radius: 195px; animation-delay: -10s;"></div>

      <svg viewBox="0 0 340 340">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color: #00d4ff;" />
            <stop offset="50%" style="stop-color: #7c4dff;" />
            <stop offset="100%" style="stop-color: #ff6b6b;" />
          </linearGradient>
        </defs>
        <!-- 刻度 -->
        <g id="ticks"></g>
        <!-- 背景环 -->
        <circle class="ring-bg" cx="170" cy="170" r="155" />
        <!-- 进度环 -->
        <circle class="ring-progress" id="ringProgress" cx="170" cy="170" r="155"
          stroke-dasharray="974" stroke-dashoffset="0" />
      </svg>

      <!-- 中间时间 -->
      <div class="timer-display idle" id="timerDisplay">
        <div class="time-segment">
          <span class="time-value" id="hoursDisplay">00</span>
          <span class="time-label">时</span>
        </div>
        <span class="time-colon">:</span>
        <div class="time-segment">
          <span class="time-value" id="minutesDisplay">00</span>
          <span class="time-label">分</span>
        </div>
        <span class="time-colon">:</span>
        <div class="time-segment">
          <span class="time-value" id="secondsDisplay">00</span>
          <span class="time-label">秒</span>
        </div>
      </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-section" id="inputSection">
      <div class="input-row">
        <div class="input-group">
          <label>时</label>
          <input type="number" class="time-input" id="inputHours" min="0" max="99" value="0" placeholder="00">
        </div>
        <span class="input-separator">:</span>
        <div class="input-group">
          <label>分</label>
          <input type="number" class="time-input" id="inputMinutes" min="0" max="59" value="5" placeholder="00">
        </div>
        <span class="input-separator">:</span>
        <div class="input-group">
          <label>秒</label>
          <input type="number" class="time-input" id="inputSeconds" min="0" max="59" value="0" placeholder="00">
        </div>
      </div>

      <div class="presets">
        <button class="preset-btn" data-time="60">1 分钟</button>
        <button class="preset-btn" data-time="180">3 分钟</button>
        <button class="preset-btn" data-time="300">5 分钟</button>
        <button class="preset-btn" data-time="600">10 分钟</button>
        <button class="preset-btn" data-time="1500">25 分钟</button>
        <button class="preset-btn" data-time="3600">1 小时</button>
      </div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls" id="controls">
      <button class="btn btn-start" id="btnStart">
        <span class="btn-icon">▶</span> 开始
      </button>
    </div>
  </div>

  <!-- 完成覆盖层 -->
  <div class="completion-overlay" id="completionOverlay">
    <div class="completion-text">时间到！</div>
    <div class="completion-sub">倒计时已结束</div>
    <button class="btn btn-start" id="btnNewTimer">
      <span class="btn-icon">↺</span> 新的倒计时
    </button>
  </div>

  <script>
    // ============ 状态管理 ============
    const State = {
      IDLE: 'idle',
      RUNNING: 'running',
      PAUSED: 'paused',
      COMPLETED: 'completed'
    };

    let currentState = State.IDLE;
    let totalSeconds = 0;
    let remainingSeconds = 0;
    let intervalId = null;
    let soundEnabled = true;

    // ============ DOM 元素 ============
    const $ = id => document.getElementById(id);
    const hoursDisplay = $('hoursDisplay');
    const minutesDisplay = $('minutesDisplay');
    const secondsDisplay = $('secondsDisplay');
    const timerDisplay = $('timerDisplay');
    const ringProgress = $('ringProgress');
    const progressBar = $('progressBar');
    const inputSection = $('inputSection');
    const controls = $('controls');
    const completionOverlay = $('completionOverlay');
    const inputHours = $('inputHours');
    const inputMinutes = $('inputMinutes');
    const inputSeconds = $('inputSeconds');

    const circumference = 2 * Math.PI * 155; // ~974

    // ============ 初始化 ============
    function init() {
      generateStars();
      generateTicks();
      setupEventListeners();
      updateRing(1);
    }

    // 生成星星
    function generateStars() {
      const container = $('stars');
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
        star.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7).toFixed(2));
        star.style.animationDelay = (Math.random() * 5) + 's';
        star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
        container.appendChild(star);
      }
    }

    // 生成刻度
    function generateTicks() {
      const ticksGroup = $('ticks');
      const cx = 170, cy = 170, r = 155;
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * Math.PI / 180;
        const isMajor = i % 5 === 0;
        const innerR = isMajor ? r - 12 : r - 6;
        const x1 = cx + innerR * Math.cos(angle);
        const y1 = cy + innerR * Math.sin(angle);
        const x2 = cx + r * Math.cos(angle);
        const y2 = cy + r * Math.sin(angle);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', isMajor ? 'rgba(0,212,255,0.15)' : 'rgba(0,212,255,0.06)');
        line.setAttribute('stroke-width', isMajor ? '2' : '1');
        ticksGroup.appendChild(line);
      }
    }

    // ============ 事件监听 ============
    function setupEventListeners() {
      $('btnStart').addEventListener('click', startTimer);

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const time = parseInt(btn.dataset.time);
          setInputFromSeconds(time);
        });
      });

      $('soundToggle').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        $('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
      });

      $('btnNewTimer').addEventListener('click', resetTimer);

      // 输入校验
      [inputHours, inputMinutes, inputSeconds].forEach(input => {
        input.addEventListener('input', () => {
          let val = parseInt(input.value) || 0;
          const max = input === inputHours ? 99 : 59;
          if (val > max) input.value = max;
          if (val < 0) input.value = 0;
        });
        input.addEventListener('focus', () => input.select());
      });

      // 键盘快捷键
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (currentState === State.IDLE) startTimer();
          else if (currentState === State.RUNNING) pauseTimer();
          else if (currentState === State.PAUSED) resumeTimer();
        }
        if (e.code === 'Escape') resetTimer();
      });
    }

    // ============ 核心逻辑 ============
    function startTimer() {
      const h = parseInt(inputHours.value) || 0;
      const m = parseInt(inputMinutes.value) || 0;
      const s = parseInt(inputSeconds.value) || 0;
      totalSeconds = h * 3600 + m * 60 + s;

      if (totalSeconds <= 0) {
        shakeInput();
        return;
      }

      remainingSeconds = totalSeconds;
      currentState = State.RUNNING;

      inputSection.classList.add('hidden');
      timerDisplay.classList.remove('idle', 'paused');
      updateDisplay();
      updateControls();

      intervalId = setInterval(() => {
        if (currentState === State.RUNNING) {
          remainingSeconds--;
          updateDisplay();
          updateRing(remainingSeconds / totalSeconds);
          progressBar.style.width = ((1 - remainingSeconds / totalSeconds) * 100) + '%';

          if (remainingSeconds <= 0) {
            completeTimer();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      currentState = State.PAUSED;
      timerDisplay.classList.add('paused');
      updateControls();
    }

    function resumeTimer() {
      currentState = State.RUNNING;
      timerDisplay.classList.remove('paused');
      updateControls();
    }

    function resetTimer() {
      clearInterval(intervalId);
      intervalId = null;
      currentState = State.IDLE;
      remainingSeconds = 0;
      totalSeconds = 0;

      timerDisplay.classList.add('idle');
      timerDisplay.classList.remove('paused');
      timerDisplay.querySelectorAll('.time-value').forEach(v => {
        v.classList.remove('warning', 'danger');
      });

      inputSection.classList.remove('hidden');
      completionOverlay.classList.remove('active');

      hoursDisplay.textContent = '00';
      minutesDisplay.textContent = '00';
      secondsDisplay.textContent = '00';
      updateRing(1);
      progressBar.style.width = '0%';
      updateControls();
    }

    function completeTimer() {
      clearInterval(intervalId);
      intervalId = null;
      currentState = State.COMPLETED;

      if (soundEnabled) playAlarm();
      completionOverlay.classList.add('active');
      launchFireworks();
      updateControls();
    }

    // ============ 更新 UI ============
    function updateDisplay() {
      const h = Math.floor(remainingSeconds / 3600);
      const m = Math.floor((remainingSeconds % 3600) / 60);
      const s = remainingSeconds % 60;

      hoursDisplay.textContent = String(h).padStart(2, '0');
      minutesDisplay.textContent = String(m).padStart(2, '0');
      secondsDisplay.textContent = String(s).padStart(2, '0');

      // 警告效果
      const allValues = [hoursDisplay, minutesDisplay, secondsDisplay];
      allValues.forEach(v => v.classList.remove('warning', 'danger'));

      if (remainingSeconds <= 10 && remainingSeconds > 0) {
        allValues.forEach(v => v.classList.add('danger'));
      } else if (remainingSeconds <= 30 && remainingSeconds > 0) {
        allValues.forEach(v => v.classList.add('warning'));
      }
    }

    function updateRing(progress) {
      const offset = circumference * (1 - progress);
      ringProgress.style.strokeDashoffset = offset;
    }

    function updateControls() {
      let html = '';

      switch (currentState) {
        case State.IDLE:
          html = `<button class="btn btn-start" id="btnStart">
            <span class="btn-icon">▶</span> 开始
          </button>`;
          break;
        case State.RUNNING:
          html = `<button class="btn btn-pause" id="btnPause">
            <span class="btn-icon">⏸</span> 暂停
          </button>
          <button class="btn btn-reset" id="btnReset">
            <span class="btn-icon">⏹</span> 重置
          </button>`;
          break;
        case State.PAUSED:
          html = `<button class="btn btn-resume" id="btnResume">
            <span class="btn-icon">▶</span> 继续
          </button>
          <button class="btn btn-reset" id="btnReset">
            <span class="btn-icon">⏹</span> 重置
          </button>`;
          break;
        case State.COMPLETED:
          html = `<button class="btn btn-start" id="btnRestart">
            <span class="btn-icon">↺</span> 重新开始
          </button>`;
          break;
      }

      controls.innerHTML = html;

      // 重新绑定事件
      const btnPause = $('btnPause');
      const btnResume = $('btnResume');
      const btnReset = $('btnReset');
      const btnRestart = $('btnRestart');

      if (btnPause) btnPause.addEventListener('click', pauseTimer);
      if (btnResume) btnResume.addEventListener('click', resumeTimer);
      if (btnReset) btnReset.addEventListener('click', resetTimer);
      if (btnRestart) btnRestart.addEventListener('click', resetTimer);
    }

    function setInputFromSeconds(totalSec) {
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      inputHours.value = h;
      inputMinutes.value = m;
      inputSeconds.value = s;
    }

    // ============ 特效 ============
    function shakeInput() {
      inputSection.style.animation = 'none';
      inputSection.offsetHeight; // 触发 reflow
      inputSection.style.animation = 'shake 0.4s ease';
      setTimeout(() => inputSection.style.animation = '', 500);
    }

    // 注入 shake 动画
    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }
    `;
    document.head.appendChild(shakeStyle);

    function launchFireworks() {
      const colors = ['#00d4ff', '#7c4dff', '#ff6b6b', '#ffd740', '#69f0ae', '#ff4081'];
      for (let burst = 0; burst < 5; burst++) {
        setTimeout(() => {
          const cx = window.innerWidth * (0.2 + Math.random() * 0.6);
          const cy = window.innerHeight * (0.2 + Math.random() * 0.5);
          for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework';
            const angle = (Math.PI * 2 / 30) * i + Math.random() * 0.3;
            const dist = 60 + Math.random() * 120;
            particle.style.left = cx + 'px';
            particle.style.top = cy + 'px';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            particle.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
            particle.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1500);
          }
        }, burst * 400);
      }
    }

    // 简易警报音（使用 Web Audio API）
    function playAlarm() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = (freq, start, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + duration);
        };

        // 播放3次双音
        for (let i = 0; i < 3; i++) {
          playBeep(880, i * 0.6, 0.15);
          playBeep(1100, i * 0.6 + 0.15, 0.15);
        }
      } catch (e) {
        // 静默失败
      }
    }

    // ============ 启动 ============
    init();
  </script>
</body>
</html>
