<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LamWriter 流式显示 Mock 测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --green: #3fb950;
      --blue: #58a6ff;
      --orange: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    header h1 { font-size: 16px; font-weight: 600; }

    .main-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 20px;
      animation: slide-up 0.3s ease-out both;
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .message.user .bubble {
      background: #1f6feb;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px 12px 4px 12px;
      max-width: 70%;
    }

    .message.assistant .bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 4px 12px 12px 12px;
    }

    .message-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      animation: fade-in 0.25s ease-out;
    }

    .process-steps {
      margin-bottom: 12px;
    }

    .process-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
      color: var(--text-muted);
      animation: slide-up 0.3s ease-out both;
    }

    .process-step .icon {
      width: 16px;
      text-align: center;
    }

    .process-step .icon.spin {
      animation: spin 1s linear infinite;
    }

    .process-step .icon.check { color: var(--green); }
    .process-step .icon.running { color: var(--blue); }

    .process-current {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
      color: var(--blue);
      animation: slide-up 0.3s ease-out both;
    }

    .answer-content {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--green);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cursor-blink 1s step-end infinite;
    }

    .tool-call {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 8px 0;
      font-size: 13px;
      animation: slide-up 0.3s ease-out both;
    }

    .tool-call .tool-name {
      color: var(--purple);
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .tool-call .tool-args {
      color: var(--text-muted);
      margin-top: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
    }

    .tool-result {
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 8px;
      padding: 8px 14px;
      margin: 8px 0;
      font-size: 13px;
      color: var(--green);
      animation: slide-up 0.3s ease-out both;
    }

    .composer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    .composer-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
      font-family: inherit;
    }

    .composer textarea:focus {
      border-color: var(--blue);
    }

    .composer button {
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .composer button:hover { background: #388bfd; }
    .composer button:disabled { opacity: 0.4; cursor: default; }

    .controls {
      position: fixed;
      top: 60px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls button {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
    }

    .controls button:hover { background: var(--border); }
    .controls button.active { background: var(--green); color: #000; border-color: var(--green); }

    /* Animations */
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes cursor-blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    @keyframes stream-enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 80px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>LamWriter</h1>
  </header>

  <div class="controls">
    <button id="btn-start" onclick="startMockStream()">开始 Mock 流式输出</button>
    <button id="btn-stop" onclick="stopMockStream()">停止</button>
    <button id="btn-clear" onclick="clearMessages()">清空</button>
  </div>

  <div class="main-area" id="thread">
    <div class="empty-state" id="empty-state">
      点击「开始 Mock 流式输出」查看效果
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="composer-input" placeholder="输入任务描述..." rows="1">写一个个人博客网站</textarea>
      <button id="send-btn" onclick="sendTask()">↑</button>
    </div>
  </div>

  <script>
    const thread = document.getElementById('thread');
    const emptyState = document.getElementById('empty-state');
    let mockTimer = null;
    let isRunning = false;
    let currentAnswerText = '';
    let assistantBubble = null;
    let answerContent = null;
    let typingCursor = null;

    function scrollToBottom() {
      thread.scrollTop = thread.scrollHeight;
    }

    function clearMessages() {
      thread.innerHTML = '<div class="empty-state" id="empty-state">点击「开始 Mock 流式输出」查看效果</div>';
      currentAnswerText = '';
      assistantBubble = null;
      answerContent = null;
      typingCursor = null;
    }

    function addUserMessage(text) {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      thread.appendChild(msg);
      scrollToBottom();
    }

    function createAssistantMessage() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.innerHTML = `
        <div class="bubble">
          <div class="message-label">
            <span class="live-dot"></span>
            <span>LamWriter</span>
          </div>
          <div class="status-text" id="live-status">等待模型响应</div>
          <div class="process-steps" id="process-steps"></div>
          <div class="answer-content" id="answer-content"></div>
        </div>
      `;
      thread.appendChild(msg);
      assistantBubble = msg;
      answerContent = msg.querySelector('#answer-content');
      typingCursor = document.createElement('span');
      typingCursor.className = 'typing-cursor';
      scrollToBottom();
    }

    function updateStatus(text) {
      const el = document.getElementById('live-status');
      if (el) {
        el.textContent = text;
        el.style.animation = 'none';
        el.offsetHeight; // trigger reflow
        el.style.animation = 'fade-in 0.25s ease-out';
      }
    }

    function addProcessStep(icon, text, isCurrent) {
      const steps = document.getElementById('process-steps');
      if (!steps) return;

      // Remove previous current
      const prevCurrent = steps.querySelector('.process-current');
      if (prevCurrent) {
        prevCurrent.className = 'process-step';
        prevCurrent.innerHTML = `<span class="icon check">✓</span><span>${prevCurrent.querySelector('span:last-child')?.textContent || text}</span>`;
      }

      if (isCurrent) {
        const step = document.createElement('div');
        step.className = 'process-current';
        step.innerHTML = `<span class="icon spin">⟳</span><span>${escapeHtml(text)}</span>`;
        steps.appendChild(step);
      } else {
        const step = document.createElement('div');
        step.className = 'process-step';
        step.innerHTML = `<span class="icon check">✓</span><span>${escapeHtml(text)}</span>`;
        steps.appendChild(step);
      }
      scrollToBottom();
    }

    function addToolCall(name, args) {
      const steps = document.getElementById('process-steps');
      if (!steps) return;

      const prevCurrent = steps.querySelector('.process-current');
      if (prevCurrent) {
        prevCurrent.className = 'process-step';
        prevCurrent.innerHTML = `<span class="icon check">✓</span><span>${prevCurrent.querySelector('span:last-child')?.textContent || ''}</span>`;
      }

      const tool = document.createElement('div');
      tool.className = 'tool-call';
      tool.innerHTML = `
        <div class="tool-name">📝 ${escapeHtml(name)}</div>
        <div class="tool-args">${escapeHtml(JSON.stringify(args))}</div>
      `;
      steps.appendChild(tool);
      scrollToBottom();
    }

    function addToolResult(text) {
      const steps = document.getElementById('process-steps');
      if (!steps) return;

      const result = document.createElement('div');
      result.className = 'tool-result';
      result.textContent = `✓ ${escapeHtml(text)}`;
      steps.appendChild(result);
      scrollToBottom();
    }

    function appendAnswerText(text) {
      currentAnswerText += text;
      if (answerContent) {
        answerContent.textContent = currentAnswerText;
        if (typingCursor && typingCursor.parentNode !== answerContent) {
          answerContent.appendChild(typingCursor);
        }
      }
      scrollToBottom();
    }

    function finishStream() {
      isRunning = false;
      const statusEl = document.getElementById('live-status');
      if (statusEl) {
        statusEl.textContent = '已完成';
        statusEl.style.color = 'var(--green)';
      }
      const dot = document.querySelector('.live-dot');
      if (dot) dot.style.background = 'var(--text-muted)';
      if (typingCursor && typingCursor.parentNode) {
        typingCursor.remove();
      }
      document.getElementById('btn-start').classList.remove('active');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Mock streaming sequence
    const mockSequence = [
      { type: 'status', text: '正在思考...' },
      { type: 'answer', text: '我来帮你创建一个个人博客网站。' },
      { type: 'answer', text: '\n\n首先，我会规划项目结构：' },
      { type: 'step', text: '分析需求，规划博客功能模块', current: true },
      { type: 'answer', text: '\n\n博客需要包含首页、文章列表、文章详情等页面。让我开始创建文件。' },
      { type: 'step', text: '创建项目目录结构', current: true },
      { type: 'tool', name: 'create_directory', args: { path: 'blog-site/' } },
      { type: 'tool-result', text: '目录已创建' },
      { type: 'step', text: '创建首页 HTML', current: true },
      { type: 'tool', name: 'create_file', args: { path: 'blog-site/index.html', content: '<!DOCTYPE html>...' } },
      { type: 'tool-result', text: 'index.html 已创建 (2.3KB)' },
      { type: 'answer', text: '\n\n首页已创建，包含导航栏、文章列表和页脚。接下来创建样式文件。' },
      { type: 'step', text: '创建 CSS 样式文件', current: true },
      { type: 'tool', name: 'create_file', args: { path: 'blog-site/style.css', content: ':root { ... }' } },
      { type: 'tool-result', text: 'style.css 已创建 (1.8KB)' },
      { type: 'answer', text: '\n\n样式文件采用了现代设计风格，支持响应式布局。' },
      { type: 'step', text: '创建 JavaScript 交互逻辑', current: true },
      { type: 'tool', name: 'create_file', args: { path: 'blog-site/app.js', content: 'document.addEventListener(...)' } },
      { type: 'tool-result', text: 'app.js 已创建 (1.2KB)' },
      { type: 'answer', text: '\n\n添加了文章加载、搜索和暗色模式切换功能。' },
      { type: 'step', text: '创建文章详情页模板', current: true },
      { type: 'tool', name: 'create_file', args: { path: 'blog-site/article.html' } },
      { type: 'tool-result', text: 'article.html 已创建 (3.1KB)' },
      { type: 'answer', text: '\n\n文章详情页支持 Markdown 渲染、代码高亮和评论功能。' },
      { type: 'step', text: '创建 README 文档', current: true },
      { type: 'tool', name: 'create_file', args: { path: 'blog-site/README.md' } },
      { type: 'tool-result', text: 'README.md 已创建' },
      { type: 'answer', text: '\n\n✅ 个人博客网站已创建完成！项目包含：\n- 响应式首页\n- 文章列表和详情页\n- 暗色模式支持\n- 搜索功能\n- Markdown 渲染\n\n你可以在浏览器中打开 index.html 预览效果。' },
      { type: 'finish' },
    ];

    function startMockStream() {
      if (isRunning) return;
      isRunning = true;
      currentAnswerText = '';
      document.getElementById('btn-start').classList.add('active');

      clearMessages();
      addUserMessage('写一个个人博客网站');

      setTimeout(() => {
        createAssistantMessage();

        let index = 0;
        function next() {
          if (!isRunning || index >= mockSequence.length) {
            if (isRunning) finishStream();
            return;
          }

          const item = mockSequence[index];
          switch (item.type) {
            case 'status':
              updateStatus(item.text);
              break;
            case 'answer':
              appendAnswerText(item.text);
              break;
            case 'step':
              addProcessStep('⟳', item.text, item.current);
              break;
            case 'tool':
              addToolCall(item.name, item.args);
              break;
            case 'tool-result':
              addToolResult(item.text);
              break;
            case 'finish':
              finishStream();
              return;
          }
          index++;
          // Random delay between 800-2000ms for realistic feel
          const delay = 800 + Math.random() * 1200;
          mockTimer = setTimeout(next, delay);
        }
        next();
      }, 500);
    }

    function stopMockStream() {
      isRunning = false;
      if (mockTimer) clearTimeout(mockTimer);
      document.getElementById('btn-start').classList.remove('active');
    }

    function sendTask() {
      const input = document.getElementById('composer-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      startMockStream();
    }

    // Auto-start on load for quick demo
    window.addEventListener('load', () => {
      setTimeout(startMockStream, 1000);
    });
  </script>
</body>
</html>
