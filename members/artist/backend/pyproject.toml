[project]
name = "lamartist"
version = "0.5.0"
description = "AI Image Generation Manager"
requires-python = ">=3.14"

[project.scripts]
artist = "app.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests — real HTTP calls, no mocks",
    "pipeline: integration pipeline tests — mock external APIs only",
]
