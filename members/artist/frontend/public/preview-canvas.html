<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案一：沉浸式画布模式</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #0a0a0a; color: #e5e5e5; overflow: hidden; height: 100vh;
}

/* 左侧图标栏 */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 48px;
  background: #111; border-right: 1px solid #222;
  display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px;
  z-index: 100;
}
.sidebar-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #666; cursor: pointer; transition: all 0.2s;
}
.sidebar-icon:hover, .sidebar-icon.active { background: #222; color: #fff; }

/* 顶部信息条 */
.topbar {
  position: fixed; top: 0; left: 48px; right: 0; height: 40px;
  background: rgba(10,10,10,0.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 90; font-size: 13px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.session-chip {
  background: #1a1a1a; border: 1px solid #333; padding: 3px 10px; border-radius: 4px;
  font-size: 12px; color: #999;
}
.zoom-controls { display: flex; align-items: center; gap: 8px; }
.zoom-btn {
  background: #1a1a1a; border: 1px solid #333; color: #999;
  width: 28px; height: 28px; border-radius: 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.zoom-btn:hover { background: #222; color: #fff; }

/* 画布区域 */
.canvas-container {
  position: fixed; top: 40px; left: 48px; right: 0; bottom: 72px;
  overflow: auto; cursor: grab; background: #0a0a0a;
}
.canvas-container:active { cursor: grabbing; }
.canvas-content {
  width: 3000px; height: 2000px; position: relative;
  background-image:
    radial-gradient(circle, #1a1a1a 1px, transparent 1px);
  background-size: 40px 40px;
}

/* 图片卡片集群 */
.card-cluster {
  position: absolute; background: #151515; border: 1px solid #2a2a2a;
  border-radius: 12px; padding: 16px; min-width: 320px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.cluster-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; font-size: 12px; color: #666;
}
.cluster-title { color: #ccc; font-weight: 500; }
.cluster-time { font-size: 11px; }
.cluster-images {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
}
.cluster-img {
  width: 140px; height: 140px; object-fit: cover; border-radius: 8px;
  border: 1px solid #2a2a2a; cursor: pointer; transition: transform 0.2s;
}
.cluster-img:hover { transform: scale(1.03); border-color: #444; }

/* 便签 */
.sticky-note {
  position: absolute; background: #1a1a1a; border: 1px solid #333;
  border-radius: 8px; padding: 12px; max-width: 240px; font-size: 13px;
  line-height: 1.6; color: #bbb; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.sticky-note::before {
  content: ''; position: absolute; top: -1px; left: 20px; right: 20px; height: 2px;
  background: #444; border-radius: 1px;
}

/* 底部命令条 */
.command-bar {
  position: fixed; bottom: 0; left: 48px; right: 0; height: 72px;
  background: rgba(15,15,15,0.95); backdrop-filter: blur(20px);
  border-top: 1px solid #222; display: flex; align-items: center;
  padding: 0 24px; gap: 12px; z-index: 100;
}
.cmd-input-wrapper {
  flex: 1; display: flex; align-items: center;
  background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
  padding: 0 16px; height: 48px; gap: 12px;
}
.cmd-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: #e5e5e5; font-size: 14px;
}
.cmd-input::placeholder { color: #555; }
.cmd-chip {
  background: #252525; border: 1px solid #383838;
  padding: 4px 10px; border-radius: 6px; font-size: 11px; color: #888;
  cursor: pointer; transition: all 0.15s;
}
.cmd-chip:hover { background: #333; color: #ccc; }
.cmd-send {
  width: 40px; height: 40px; border-radius: 10px;
  background: #e5e5e5; color: #000; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px;
}
.cmd-send:hover { background: #fff; }

/* 位置 */
.c1 { top: 80px; left: 80px; }
.c2 { top: 80px; left: 520px; }
.c3 { top: 400px; left: 200px; }
.s1 { top: 100px; left: 900px; }
.s2 { top: 350px; left: 700px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-icon active" title="画布">◈</div>
  <div class="sidebar-icon" title="会话">☰</div>
  <div class="sidebar-icon" title="API">⚡</div>
  <div class="sidebar-icon" title="技能">✦</div>
  <div class="sidebar-icon" title="设置">◉</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <span style="font-weight:600;color:#fff;">lamartist</span>
    <span class="session-chip">会话 #7 · 赛博朋克风格探索</span>
  </div>
  <div class="zoom-controls">
    <button class="zoom-btn">−</button>
    <span style="font-size:12px;color:#666;">100%</span>
    <button class="zoom-btn">+</button>
  </div>
</div>

<div class="canvas-container">
  <div class="canvas-content">
    <div class="card-cluster c1">
      <div class="cluster-header">
        <span class="cluster-title">第一轮：基础概念</span>
        <span class="cluster-time">2分钟前</span>
      </div>
      <div class="cluster-images">
        <div class="cluster-img" style="background:linear-gradient(135deg,#1a0a2e,#0d1b2a);"></div>
        <div class="cluster-img" style="background:linear-gradient(135deg,#2d1b4e,#1a1a2e);"></div>
        <div class="cluster-img" style="background:linear-gradient(135deg,#0f3460,#16213e);"></div>
        <div class="cluster-img" style="background:linear-gradient(135deg,#1a1a2e,#0d1b2a);"></div>
      </div>
    </div>

    <div class="card-cluster c2">
      <div class="cluster-header">
        <span class="cluster-title">第二轮：细节增强</span>
        <span class="cluster-time">刚刚</span>
      </div>
      <div class="cluster-images">
        <div class="cluster-img" style="background:linear-gradient(135deg,#e94560,#0f3460);"></div>
        <div class="cluster-img" style="background:linear-gradient(135deg,#533483,#16213e);"></div>
      </div>
    </div>

    <div class="sticky-note s1">
      用户要求：赛博朋克风格的未来城市夜景，要有霓虹灯光和雨夜反射效果。参考《银翼杀手2049》的色调。
    </div>

    <div class="sticky-note s2">
      优化方向：增加更多东亚元素（汉字招牌、拉面店），调整色调偏青绿色而非纯蓝紫。
    </div>
  </div>
</div>

<div class="command-bar">
  <div class="cmd-input-wrapper">
    <span style="color:#555;font-size:16px;">⌘</span>
    <input class="cmd-input" placeholder="输入生图指令，或拖动图片到画布...">
    <span class="cmd-chip">4张</span>
    <span class="cmd-chip">1024×1024</span>
    <span class="cmd-chip">细节增强</span>
  </div>
  <button class="cmd-send">↑</button>
</div>

</body>
</html>
