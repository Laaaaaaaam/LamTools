<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案四：标签工作站模式</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #fafafa; color: #1a1a1a; overflow: hidden; height: 100vh;
}

/* 左侧图标栏 */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 48px;
  background: #fff; border-right: 1px solid #e5e5e5;
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 4px; z-index: 100;
}
.sidebar-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #999; cursor: pointer; transition: all 0.2s; font-size: 16px;
}
.sidebar-icon:hover { background: #f5f5f5; color: #333; }
.sidebar-icon.active { background: #1a1a1a; color: #fff; }

/* 顶部栏 */
.topbar {
  position: fixed; top: 0; left: 48px; right: 0; height: 44px;
  background: #fff; border-bottom: 1px solid #e5e5e5;
  display: flex; align-items: center; padding: 0 16px; z-index: 90;
}

/* 标签栏 */
.tab-bar {
  display: flex; align-items: center; gap: 4px; flex: 1;
  overflow-x: auto;
}
.tab {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 8px; font-size: 13px;
  color: #666; cursor: pointer; transition: all 0.15s;
  white-space: nowrap; border: 1px solid transparent;
}
.tab:hover { background: #f5f5f5; }
.tab.active { background: #1a1a1a; color: #fff; }
.tab-close { font-size: 16px; opacity: 0.5; }
.tab-close:hover { opacity: 1; }
.tab-new {
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #999; cursor: pointer; font-size: 18px;
}
.tab-new:hover { background: #f5f5f5; color: #333; }

.topbar-billing { font-size: 12px; color: #999; margin-left: 16px; cursor: pointer; }

/* 分屏容器 */
.workspace {
  position: fixed; top: 44px; left: 48px; right: 320px; bottom: 0;
  display: flex;
}
.pane {
  flex: 1; display: flex; flex-direction: column;
  border-right: 1px solid #e5e5e5; background: #fafafa;
}
.pane:last-child { border-right: none; }
.pane-header {
  padding: 10px 16px; border-bottom: 1px solid #e5e5e5;
  background: #fff; display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 500;
}
.pane-actions { display: flex; gap: 8px; }
.pane-btn {
  font-size: 12px; color: #999; cursor: pointer; padding: 2px 6px; border-radius: 4px;
}
.pane-btn:hover { background: #f5f5f5; color: #333; }

.pane-content {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}

/* 消息 */
.msg-bubble {
  max-width: 90%; padding: 12px 16px; border-radius: 14px;
  font-size: 13px; line-height: 1.6; background: #fff;
  border: 1px solid #e5e5e5;
}
.msg-bubble.user {
  align-self: flex-end; background: #1a1a1a; color: #fff; border-color: #1a1a1a;
}

/* 图片网格 */
.img-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px;
}
.img-cell {
  aspect-ratio: 1; border-radius: 12px; overflow: hidden;
  border: 1px solid #e5e5e5; cursor: pointer; background: #e5e5e5;
  position: relative;
}
.img-cell:hover { border-color: #ccc; }
.img-cell img { width: 100%; height: 100%; object-fit: cover; }

/* 输入区 */
.pane-input {
  padding: 12px 16px; border-top: 1px solid #e5e5e5; background: #fff;
}
.pane-input-box {
  display: flex; align-items: center; gap: 8px;
  background: #f5f5f5; border-radius: 12px; padding: 0 12px; height: 40px;
}
.pane-input-box input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 13px;
}
.pane-input-box button {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: #1a1a1a; color: #fff; cursor: pointer;
}

/* 右侧工具箱 */
.toolbox {
  position: fixed; top: 44px; right: 0; width: 320px; bottom: 0;
  background: #fff; border-left: 1px solid #e5e5e5;
  display: flex; flex-direction: column; z-index: 80;
}
.toolbox-tabs {
  display: flex; border-bottom: 1px solid #e5e5e5;
}
.toolbox-tab {
  flex: 1; padding: 12px; text-align: center; font-size: 12px;
  color: #999; cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; font-weight: 500;
}
.toolbox-tab:hover { color: #333; }
.toolbox-tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

.toolbox-content { flex: 1; overflow-y: auto; padding: 16px; }

.tool-section { margin-bottom: 20px; }
.tool-section-title { font-size: 11px; font-weight: 600; color: #999; margin-bottom: 8px; text-transform: uppercase; }
.tool-btn {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1px solid #e5e5e5; background: #fff; margin-bottom: 6px;
  font-size: 13px; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 10px;
}
.tool-btn:hover { background: #f5f5f5; }
.tool-btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

/* 分屏拖拽条 */
.resizer {
  width: 4px; background: #e5e5e5; cursor: col-resize;
  transition: background 0.15s;
}
.resizer:hover { background: #ccc; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-icon active" title="会话">◈</div>
  <div class="sidebar-icon" title="API">⚡</div>
  <div class="sidebar-icon" title="技能">✦</div>
  <div class="sidebar-icon" title="规则">◉</div>
  <div class="sidebar-icon" title="设置">◐</div>
</div>

<div class="topbar">
  <div class="tab-bar">
    <div class="tab active">赛博朋克城市 <span class="tab-close">×</span></div>
    <div class="tab">机械忍者 <span class="tab-close">×</span></div>
    <div class="tab active">森林精灵 <span class="tab-close">×</span></div>
    <div class="tab-new">+</div>
  </div>
  <span class="topbar-billing">本月 ¥128.50</span>
</div>

<div class="workspace">
  <!-- 左分屏 -->
  <div class="pane">
    <div class="pane-header">
      <span>赛博朋克城市</span>
      <div class="pane-actions">
        <span class="pane-btn">⇄ 分屏</span>
        <span class="pane-btn">× 关闭</span>
      </div>
    </div>
    <div class="pane-content">
      <div class="msg-bubble user">生成赛博朋克城市夜景</div>
      <div class="msg-bubble">
        已生成4张图片
        <div class="img-grid">
          <div class="img-cell" style="background:linear-gradient(135deg,#1a0a2e,#0d1b2a);"></div>
          <div class="img-cell" style="background:linear-gradient(135deg,#2d1b4e,#16213e);"></div>
          <div class="img-cell" style="background:linear-gradient(135deg,#0f3460,#1a1a2e);"></div>
          <div class="img-cell" style="background:linear-gradient(135deg,#533483,#0d1b2a);"></div>
        </div>
      </div>
    </div>
    <div class="pane-input">
      <div class="pane-input-box">
        <input placeholder="输入指令...">
        <button>↑</button>
      </div>
    </div>
  </div>

  <div class="resizer"></div>

  <!-- 右分屏 -->
  <div class="pane">
    <div class="pane-header">
      <span>森林精灵</span>
      <div class="pane-actions">
        <span class="pane-btn">⇄ 分屏</span>
        <span class="pane-btn">× 关闭</span>
      </div>
    </div>
    <div class="pane-content">
      <div class="msg-bubble user">森林精灵角色设计，绿色系</div>
      <div class="msg-bubble">
        已生成4张图片
        <div class="img-grid">
          <div class="img-cell" style="background:linear-gradient(135deg,#2d6a4f,#40916c);"></div>
          <div class="img-cell" style="background:linear-gradient(135deg,#52b788,#74c69d);"></div>
          <div class="img-cell" style="background:linear-gradient(135deg,#1b4332,#2d6a4f);"></div>
          <div class="img-cell" style="background:linear-gradient(135deg,#40916c,#52b788);"></div>
        </div>
      </div>
    </div>
    <div class="pane-input">
      <div class="pane-input-box">
        <input placeholder="输入指令...">
        <button>↑</button>
      </div>
    </div>
  </div>
</div>

<!-- 右侧工具箱 -->
<div class="toolbox">
  <div class="toolbox-tabs">
    <div class="toolbox-tab active">助手</div>
    <div class="toolbox-tab">优化</div>
    <div class="toolbox-tab">规划</div>
    <div class="toolbox-tab">技能</div>
  </div>
  <div class="toolbox-content">
    <div class="tool-section">
      <div class="tool-section-title">快速操作</div>
      <button class="tool-btn primary">🎨 优化当前提示词</button>
      <button class="tool-btn">📋 复制提示词</button>
      <button class="tool-btn">🔄 重新生成</button>
    </div>
    <div class="tool-section">
      <div class="tool-section-title">优化方向</div>
      <button class="tool-btn">细节增强</button>
      <button class="tool-btn">风格统一</button>
      <button class="tool-btn">构图优化</button>
    </div>
    <div class="tool-section">
      <div class="tool-section-title">对话</div>
      <div style="background:#f5f5f5;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;color:#666;">
        <p style="margin-bottom:8px;"><strong style="color:#333;">用户：</strong>这张图的色调能再暖一些吗？</p>
        <p><strong style="color:#333;">助手：</strong>可以调整色温偏向暖色调，增加橙黄色霓虹灯光的比例。</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
