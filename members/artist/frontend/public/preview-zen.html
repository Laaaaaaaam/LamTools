<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案五：极简禅模式</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #fff; color: #1a1a1a; overflow: hidden; height: 100vh;
}

/* 边缘触发区 */
.edge-trigger {
  position: fixed; z-index: 200;
  transition: all 0.3s;
}
.edge-trigger.left { top: 0; left: 0; width: 8px; bottom: 0; }
.edge-trigger.top { top: 0; left: 0; right: 0; height: 8px; }
.edge-trigger.right { top: 0; right: 0; width: 8px; bottom: 0; }

/* 左边缘面板 */
.left-panel {
  position: fixed; top: 0; left: 0; width: 280px; bottom: 0;
  background: #fff; border-right: 1px solid #e5e5e5;
  transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 150; padding: 24px;
}
.left-panel.open { transform: translateX(0); }
.panel-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.2);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 140;
}
.panel-overlay.open { opacity: 1; pointer-events: auto; }

/* 顶部面板 */
.top-panel {
  position: fixed; top: 0; left: 0; right: 0; height: 52px;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
  border-bottom: 1px solid #e5e5e5;
  transform: translateY(-100%); transition: transform 0.3s;
  z-index: 150; display: flex; align-items: center;
  padding: 0 24px; justify-content: space-between;
}
.top-panel.open { transform: translateY(0); }

/* 右边缘面板 */
.right-panel {
  position: fixed; top: 0; right: 0; width: 340px; bottom: 0;
  background: #fff; border-left: 1px solid #e5e5e5;
  transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 150;
}
.right-panel.open { transform: translateX(0); }

/* 主聊天区 */
.chat-area {
  position: fixed; inset: 0;
  overflow-y: auto; padding: 40px 32px 120px;
  display: flex; flex-direction: column; align-items: center;
}

/* 极度克制的消息 */
.messages {
  width: 100%; max-width: 800px;
  display: flex; flex-direction: column; gap: 32px;
}

.msg-group { display: flex; flex-direction: column; gap: 12px; }
.msg-group.user { align-items: flex-end; }
.msg-group.assistant { align-items: flex-start; }

.msg-text {
  font-size: 15px; line-height: 1.8; color: #333;
  max-width: 600px;
}
.msg-group.user .msg-text {
  color: #666; font-style: italic;
}

/* 全宽无框图片 */
.msg-images {
  width: 100%; max-width: 800px;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
}
.img-frame {
  aspect-ratio: 1; border-radius: 4px; overflow: hidden;
  cursor: pointer; position: relative; background: #f5f5f5;
  transition: all 0.3s;
}
.img-frame img { width: 100%; height: 100%; object-fit: cover; }
.img-frame:hover { border-radius: 8px; }
.img-actions {
  position: absolute; inset: 0; background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  gap: 16px; opacity: 0; transition: opacity 0.2s;
}
.img-frame:hover .img-actions { opacity: 1; }
.img-action {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.9); border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; color: #333;
  transform: translateY(10px); transition: all 0.2s;
}
.img-frame:hover .img-action { transform: translateY(0); }

/* 分隔线 */
.divider {
  width: 40px; height: 1px; background: #e5e5e5; margin: 8px auto;
}

/* 底部输入区 */
.input-zone {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 20px 32px 32px;
  background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0));
  display: flex; justify-content: center; z-index: 100;
}
.input-box {
  width: 100%; max-width: 800px;
  display: flex; flex-direction: column; gap: 12px;
}
.input-field {
  width: 100%; padding: 16px 20px;
  border: none; border-radius: 16px;
  background: #f5f5f5; font-size: 15px;
  outline: none; transition: all 0.2s;
  color: #1a1a1a;
}
.input-field:focus {
  background: #fff; box-shadow: 0 0 0 1px #e5e5e5, 0 4px 20px rgba(0,0,0,0.08);
}
.input-field::placeholder { color: #bbb; }

.input-meta {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4px;
}
.input-hint { font-size: 12px; color: #bbb; }
.input-actions { display: flex; gap: 12px; align-items: center; }
.input-action {
  font-size: 12px; color: #999; cursor: pointer;
  padding: 4px 10px; border-radius: 6px; transition: all 0.15s;
}
.input-action:hover { color: #333; background: #f5f5f5; }
.input-send {
  width: 36px; height: 36px; border-radius: 10px;
  background: #1a1a1a; color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.input-send:hover { background: #333; }

/* 会话列表面板内容 */
.session-list { margin-top: 16px; }
.session-item {
  padding: 12px; border-radius: 10px; cursor: pointer;
  margin-bottom: 4px; transition: all 0.15s;
  display: flex; align-items: center; gap: 12px;
}
.session-item:hover { background: #f5f5f5; }
.session-item.active { background: #1a1a1a; color: #fff; }
.session-thumb {
  width: 40px; height: 40px; border-radius: 8px; background: #e5e5e5; flex-shrink: 0;
}
.session-info { flex: 1; }
.session-name { font-size: 13px; font-weight: 500; }
.session-meta { font-size: 11px; opacity: 0.6; margin-top: 2px; }

/* 助手面板内容 */
.assistant-body { padding: 24px; }
.assistant-tabs {
  display: flex; gap: 2px; margin-bottom: 20px;
}
.assistant-tab {
  padding: 8px 16px; border-radius: 8px; font-size: 13px;
  color: #999; cursor: pointer; transition: all 0.15s;
}
.assistant-tab:hover { color: #333; }
.assistant-tab.active { background: #1a1a1a; color: #fff; }

.option-group { margin-bottom: 20px; }
.option-title { font-size: 11px; color: #999; margin-bottom: 8px; text-transform: uppercase; }
.option-item {
  padding: 10px 12px; border-radius: 10px; font-size: 13px;
  color: #666; cursor: pointer; margin-bottom: 4px;
  transition: all 0.15s;
}
.option-item:hover { background: #f5f5f5; }
.option-item.active { background: #1a1a1a; color: #fff; }
</style>
</head>
<body>

<!-- 边缘触发区 -->
<div class="edge-trigger left" onmouseenter="openLeft()"></div>
<div class="edge-trigger top" onmouseenter="openTop()"></div>
<div class="edge-trigger right" onmouseenter="openRight()"></div>

<!-- 遮罩 -->
<div class="panel-overlay" id="overlay" onclick="closeAll()"></div>

<!-- 左侧面板 -->
<div class="left-panel" id="leftPanel">
  <div style="font-size:18px;font-weight:600;margin-bottom:4px;">lamartist</div>
  <div style="font-size:12px;color:#999;margin-bottom:20px;">按 Escape 关闭</div>
  <div class="session-list">
    <div class="session-item active">
      <div class="session-thumb" style="background:linear-gradient(135deg,#1a0a2e,#0d1b2a);"></div>
      <div class="session-info">
        <div class="session-name">赛博朋克城市夜景</div>
        <div class="session-meta">7张图 · 2分钟前</div>
      </div>
    </div>
    <div class="session-item">
      <div class="session-thumb" style="background:linear-gradient(135deg,#e94560,#0f3460);"></div>
      <div class="session-info">
        <div class="session-name">机械忍者角色</div>
        <div class="session-meta">4张图 · 1小时前</div>
      </div>
    </div>
    <div class="session-item">
      <div class="session-thumb" style="background:linear-gradient(135deg,#2d6a4f,#40916c);"></div>
      <div class="session-info">
        <div class="session-name">森林精灵概念</div>
        <div class="session-meta">12张图 · 昨天</div>
      </div>
    </div>
  </div>
</div>

<!-- 顶部面板 -->
<div class="top-panel" id="topPanel">
  <span style="font-weight:600;">lamartist</span>
  <span style="font-size:12px;color:#999;">本月 ¥128.50</span>
</div>

<!-- 右侧面板 -->
<div class="right-panel" id="rightPanel">
  <div class="assistant-body">
    <div class="assistant-tabs">
      <div class="assistant-tab active">对话</div>
      <div class="assistant-tab">优化</div>
      <div class="assistant-tab">规划</div>
      <div class="assistant-tab">技能</div>
    </div>
    <div class="option-group">
      <div class="option-title">优化方向</div>
      <div class="option-item active">细节增强</div>
      <div class="option-item">风格统一</div>
      <div class="option-item">构图优化</div>
      <div class="option-item">色彩调整</div>
    </div>
    <div class="option-group">
      <div class="option-title">执行策略</div>
      <div class="option-item active">并发生成</div>
      <div class="option-item">顺序迭代</div>
    </div>
  </div>
</div>

<!-- 主聊天区 -->
<div class="chat-area">
  <div class="messages">
    <div class="msg-group user">
      <div class="msg-text">生成一组赛博朋克风格的城市夜景，要有霓虹灯光和雨夜反射效果。</div>
    </div>

    <div class="divider"></div>

    <div class="msg-group assistant">
      <div class="msg-text">已为您生成4张赛博朋克城市夜景图。画面采用了蓝紫色调配合霓虹灯光，雨夜路面反射增强了氛围感。</div>
      <div class="msg-images">
        <div class="img-frame" style="background:linear-gradient(135deg,#1a0a2e,#0d1b2a);">
          <div class="img-actions">
            <button class="img-action">⬇</button>
            <button class="img-action">✎</button>
            <button class="img-action">◉</button>
          </div>
        </div>
        <div class="img-frame" style="background:linear-gradient(135deg,#2d1b4e,#16213e);">
          <div class="img-actions">
            <button class="img-action">⬇</button>
            <button class="img-action">✎</button>
            <button class="img-action">◉</button>
          </div>
        </div>
        <div class="img-frame" style="background:linear-gradient(135deg,#0f3460,#1a1a2e);">
          <div class="img-actions">
            <button class="img-action">⬇</button>
            <button class="img-action">✎</button>
            <button class="img-action">◉</button>
          </div>
        </div>
        <div class="img-frame" style="background:linear-gradient(135deg,#533483,#0d1b2a);">
          <div class="img-actions">
            <button class="img-action">⬇</button>
            <button class="img-action">✎</button>
            <button class="img-action">◉</button>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="msg-group user">
      <div class="msg-text">第2张不错，基于那张再生成几张变体，加入更多东亚元素。</div>
    </div>
  </div>
</div>

<!-- 底部输入 -->
<div class="input-zone">
  <div class="input-box">
    <input class="input-field" placeholder="输入生图指令..." value="基于第2张生成变体，加入东亚元素">
    <div class="input-meta">
      <span class="input-hint">鼠标移到屏幕边缘打开面板 · Enter 发送</span>
      <div class="input-actions">
        <span class="input-action">4张</span>
        <span class="input-action">1024×1024</span>
        <span class="input-action">细节增强</span>
        <button class="input-send">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
function openLeft() { document.getElementById('leftPanel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function openTop() { document.getElementById('topPanel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function openRight() { document.getElementById('rightPanel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeAll() {
  document.getElementById('leftPanel').classList.remove('open');
  document.getElementById('topPanel').classList.remove('open');
  document.getElementById('rightPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
</script>

</body>
</html>
